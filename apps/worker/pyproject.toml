[project]
name = "insuranceai-worker"
version = "0.1.0"
description = "保險業務員 AI 平台背景 Worker：每日新聞彙整（之後加入建議書 PDF 擷取與去識別化）"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.11",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
insuranceai-worker = "worker.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
