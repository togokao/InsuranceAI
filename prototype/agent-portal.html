<title>業務員 AI 工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: iPad 橫向為主的 app shell — 左側導覽欄 + 主內容；窄螢幕改為底部導覽列 */
:root{
  --bg:#EDF1F0; --surface:#FFFFFF; --surface-2:#F5F8F7; --sunken:#E2E8E6;
  --ink:#15252A; --muted:#58696E; --line:#D2DBD8;
  --brand:#0E5961; --brand-ink:#FFFFFF; --brand-soft:#D7E9E8;
  --accent:#B5661A; --accent-soft:#F5E5D0;
  --ok:#2B7749; --ok-soft:#DAEEE1; --warn:#946410; --warn-soft:#F6EACB; --bad:#AB3434; --bad-soft:#F5DADA;
  --shadow:0 1px 2px rgba(16,40,45,.06),0 6px 20px rgba(16,40,45,.07);
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --f-display:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1618; --surface:#162126; --surface-2:#1B282D; --sunken:#0B1214;
  --ink:#E3ECEA; --muted:#93A6AA; --line:#2A3B40;
  --brand:#5DB2B8; --brand-ink:#08262A; --brand-soft:#173A3E;
  --accent:#E29F4D; --accent-soft:#3A2A16;
  --ok:#6BC28F; --ok-soft:#173326; --warn:#E0B65A; --warn-soft:#3A2F14; --bad:#E57A7A; --bad-soft:#3D1D1D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1618; --surface:#162126; --surface-2:#1B282D; --sunken:#0B1214;
  --ink:#E3ECEA; --muted:#93A6AA; --line:#2A3B40;
  --brand:#5DB2B8; --brand-ink:#08262A; --brand-soft:#173A3E;
  --accent:#E29F4D; --accent-soft:#3A2A16;
  --ok:#6BC28F; --ok-soft:#173326; --warn:#E0B65A; --warn-soft:#3A2F14; --bad:#E57A7A; --bad-soft:#3D1D1D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.ic{flex:none}

/* Shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.nav{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:17px}
.brand b{font-family:var(--f-display);font-size:16px;display:block;line-height:1.2}
.brand small{color:var(--muted);font-size:12px}
.nav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:0;border-radius:9px;background:none;color:var(--muted);font-weight:500;text-align:left;min-height:44px}
.nav-btn:hover{background:var(--surface-2);color:var(--ink)}
.nav-btn[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
.nav-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 8px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.topbar h1{font-family:var(--f-display);font-size:20px;margin-right:auto}
.role{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.role select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:40px}
.present-banner{background:var(--accent);color:var(--surface);padding:10px 28px;display:flex;align-items:center;gap:12px;font-weight:500;flex-wrap:wrap}
.present-banner button{margin-left:auto;background:var(--surface);color:var(--accent);border:0;border-radius:7px;padding:6px 14px;font-weight:700}
.content{padding:24px 28px 48px;display:flex;flex-direction:column;gap:20px;max-width:1280px;width:100%}
.mock-note{font-size:12px;color:var(--muted)}

/* Common */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;min-height:42px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:none;border-color:transparent;color:var(--brand)}
.btn.small{min-height:34px;padding:5px 12px;font-size:13px}
.btn.line{background:#06C755;border-color:#06C755;color:#fff}
.link{background:none;border:0;color:var(--brand);font-weight:500;padding:4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel-h h2{font-size:16px;margin-right:auto}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.h1{font-family:var(--f-display);font-size:28px}
.grid-2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;background:var(--sunken);color:var(--muted);white-space:nowrap}
.pill.brand{background:var(--brand-soft);color:var(--brand)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:36px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li+li{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:10px 4px;background:none;border:0;text-align:left;min-height:52px}
.row:hover .row-main b{color:var(--brand)}
.row-main{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.row-main small{color:var(--muted);font-size:13px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;flex:none}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;letter-spacing:.04em;color:var(--muted);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
.muted{color:var(--muted)}
.small{font-size:13px}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:8px;border:0;background:none;color:var(--muted)}
.icon-btn[aria-pressed="true"]{color:var(--accent)}
.icon-btn[aria-pressed="true"] svg{fill:var(--accent)}

/* Present mode */
.present .sensitive{display:none!important}

/* Home */
.hello{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;justify-content:space-between}
.todo-strip{display:flex;gap:10px;flex-wrap:wrap}
.todo{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);min-height:52px}
.todo-n{font-size:22px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.todo.warn .todo-n{color:var(--warn)} .todo.ok .todo-n{color:var(--ok)}
.news-row{display:flex;flex-direction:column;gap:6px;padding:12px 0}
.news-row+.news-row{border-top:1px solid var(--line)}
.news-row h3{font-size:15px;font-weight:500}
.angle{font-size:13px;background:var(--surface-2);border-left:3px solid var(--accent);padding:6px 10px;border-radius:0 6px 6px 0;color:var(--ink)}
.angle b{color:var(--accent);font-weight:500;margin-right:6px}

/* News */
.news-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.news-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.news-card h3{font-size:17px;line-height:1.45}
.news-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.news-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.match{display:flex;align-items:center;gap:4px;margin-right:auto;font-size:12px;color:var(--muted)}
.match .avatar{width:26px;height:26px;font-size:12px;margin-left:-6px;border:2px solid var(--surface)}
.match .avatar:first-of-type{margin-left:0}
.disclaim{font-size:12px;color:var(--warn)}

/* Clients */
.md{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.present .md{grid-template-columns:minmax(0,1fr)}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);min-height:42px}
.client-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.client-head .avatar{width:60px;height:60px;font-size:24px;font-family:var(--f-display)}
.client-head h2{font-family:var(--f-display);font-size:24px}
.client-actions{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.gaps{display:grid;gap:10px}
.gap{display:grid;grid-template-columns:56px minmax(0,1fr) 72px;gap:12px;align-items:center;font-size:14px}
.bar{height:12px;border-radius:6px;background:var(--sunken);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--brand)}
.bar i.after{background:repeating-linear-gradient(135deg,var(--accent) 0 5px,var(--accent-soft) 5px 9px)}
.bar i.low{background:var(--bad)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:8px;border-radius:3px;display:inline-block;background:var(--brand)}
.legend i.after{background:repeating-linear-gradient(135deg,var(--accent) 0 3px,var(--accent-soft) 3px 6px)}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.timeline li{display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;font-size:14px}
.timeline time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.note-box{background:var(--warn-soft);border-radius:8px;padding:10px 14px;font-size:14px}

/* Proposal */
.stepper{display:flex;gap:6px;list-style:none;margin:0;padding:0;overflow-x:auto}
.stepper li{flex:1;min-width:120px}
.step{width:100%;display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:0;text-align:left;color:var(--muted);font-size:13px}
.step::before{content:"";height:4px;border-radius:2px;background:var(--sunken)}
.step.done{color:var(--ink)} .step.done::before{background:var(--brand)}
.step.cur{color:var(--brand);font-weight:700} .step.cur::before{background:var(--accent)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:28px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:var(--surface-2)}
.file-chip{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.file-chip .ic{color:var(--bad)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.field select,.field input{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-height:42px;font-size:15px}
.detect{display:flex;gap:10px;align-items:flex-start;font-size:14px;background:var(--ok-soft);color:var(--ink);padding:10px 14px;border-radius:8px}
.detect .ic{color:var(--ok);margin-top:2px}
.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.doc{font-family:var(--f-body);font-size:14px;line-height:2;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:14px 16px;white-space:pre-wrap;word-break:break-all;min-width:0}
.pii{background:var(--bad-soft);color:var(--bad);border-radius:3px;padding:0 3px}
.tok{font-family:var(--f-mono);font-size:12px;background:var(--brand-soft);color:var(--brand);border-radius:3px;padding:1px 5px}
.doc-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;margin-bottom:6px;flex-wrap:wrap}
.checks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.check{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.check b{font-size:20px;font-variant-numeric:tabular-nums}
.check small{color:var(--muted);font-size:12px}
.check.pass{background:var(--ok-soft);border-color:transparent} .check.pass b{color:var(--ok)}
.stages{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.stages li{display:flex;align-items:center;gap:12px;font-size:15px}
.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);flex:none;color:var(--brand-ink)}
.stages li.done .dot{background:var(--brand);border-color:var(--brand)}
.stages li.run .dot{border-color:var(--accent);border-top-color:transparent;animation:spin 1s linear infinite}
.stages li.wait{color:var(--muted)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.stages li.run .dot{animation:none;border-top-color:var(--accent)}}
.fields td input{width:100%;min-width:180px;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);min-height:38px}
.fields tr.low td{background:var(--warn-soft)}
.fields input[type=checkbox]{width:22px;height:22px;accent-color:var(--brand)}
.fields .hint{font-size:12px;color:var(--warn);margin-top:4px}

/* Simplified sheet */
.sheet-wrap{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:20px;align-items:start}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);padding:32px 36px;display:flex;flex-direction:column;gap:22px;min-width:0}
.sheet-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:14px}
.sheet-head h2{font-family:var(--f-display);font-size:26px;line-height:1.3}
.sheet-head .prem{text-align:right}
.sheet-head .prem b{font-size:26px;font-variant-numeric:tabular-nums;color:var(--brand)}
.sec-t{font-family:var(--f-display);font-size:17px;display:flex;align-items:center;gap:8px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:4px;background:var(--surface-2)}
.tile .ic{color:var(--brand)}
.tile small{color:var(--muted);font-size:12px}
.tile b{font-size:20px;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.scen{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.scen div{border-radius:8px;background:var(--brand-soft);padding:12px 14px;font-size:14px}
.scen b{display:block;color:var(--brand);font-size:18px;font-variant-numeric:tabular-nums}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .prem{stroke:var(--accent);stroke-width:2.5;fill:none;stroke-dasharray:6 4}
.chart .cv{stroke:var(--brand);stroke-width:2.5;fill:none}
.chart .cv-area{fill:var(--brand-soft);stroke:none}
.chart .lab-p{fill:var(--accent);font-weight:700;font-size:12px}
.chart .lab-c{fill:var(--brand);font-weight:700;font-size:12px}
.chart .pt-p{fill:var(--accent)} .chart .pt-c{fill:var(--brand)}
.warnbox{border:1.5px solid var(--warn);border-radius:8px;padding:14px 16px;background:var(--warn-soft)}
.warnbox ul{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.sheet-foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.side-actions{display:flex;flex-direction:column;gap:10px;position:sticky;top:90px}

/* Needs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:10px 16px;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;min-height:44px}
.tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
.profile{display:flex;gap:10px;flex-wrap:wrap}
.profile div{background:var(--surface-2);border-radius:8px;padding:8px 12px;font-size:13px}
.profile b{display:block;font-size:15px}
.recs{display:flex;flex-direction:column;gap:12px}
.rec{border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px}
.rec h3{font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rec ul{margin:4px 0 0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:3px;grid-column:1/-1}
.score{text-align:right}
.score b{font-size:24px;color:var(--brand);font-variant-numeric:tabular-nums}
.ai-label{font-size:11px;letter-spacing:.06em;color:var(--brand);grid-column:1/-1}
.budget{display:flex;align-items:center;gap:12px;font-size:14px;flex-wrap:wrap}
.phone{width:360px;max-width:100%;margin:0 auto;border:10px solid var(--ink);border-radius:36px;background:var(--surface);padding:22px 18px;display:flex;flex-direction:column;gap:14px}
.phone h3{font-family:var(--f-display);font-size:19px}
.phone .field{color:var(--ink);font-size:14px}
.opt{display:flex;flex-wrap:wrap;gap:6px}
.opt label{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;display:flex;align-items:center;gap:5px}
.opt input{accent-color:var(--brand)}
.consent{font-size:12px;background:var(--surface-2);border-radius:8px;padding:10px;display:flex;gap:8px;align-items:flex-start}
.consent input{margin-top:3px;accent-color:var(--brand)}
input[type=range]{accent-color:var(--brand);width:100%}

/* Admin */
.switch{width:46px;height:28px;border-radius:14px;border:0;background:var(--sunken);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.switch[aria-pressed="true"]{background:var(--brand)}
.switch[aria-pressed="true"]::after{left:21px}
.co-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}

function cvChart(){
 const W=620,H=250,L=48,R=20,T=24,B=34,max=600000;
 const x=y=>L+(y-1)/29*(W-L-R), Y=v=>T+(1-v/max)*(H-T-B);
 const prem=y=>28560*Math.min(y,20);
 const cv=y=>y<=20?Math.round(28560*y*Math.min(.85,.15+.035*y)):Math.round(485520+(y-20)*4000);
 const yrs=[...Array(30)].map((_,i)=>i+1);
 const pl=yrs.map(y=>`${x(y).toFixed(1)},${Y(prem(y)).toFixed(1)}`).join(' ');
 const cl=yrs.map(y=>`${x(y).toFixed(1)},${Y(cv(y)).toFixed(1)}`).join(' ');
 const area=`${x(1)},${Y(0)} ${cl} ${x(30)},${Y(0)}`;
 const grid=[0,200000,400000,600000].map(v=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end">${v?v/10000+' 萬':'0'}</text>`).join('');
 const xt=[1,5,10,15,20,25,30].map(y=>`<text x="${x(y)}" y="${H-12}" text-anchor="middle">第 ${y} 年</text>`).join('');
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="累積已繳保費與解約金走勢：第 20 年已繳 57.1 萬，解約金約 48.6 萬">
  ${grid}${xt}
  <polygon class="cv-area" points="${area}"/>
  <polyline class="prem" points="${pl}"/>
  <polyline class="cv" points="${cl}"/>
  <circle class="pt-p" cx="${x(20)}" cy="${Y(prem(20))}" r="4.5"/><circle class="pt-c" cx="${x(20)}" cy="${Y(cv(20))}" r="4.5"/>
  <text class="lab-p" x="${x(20)-8}" y="${Y(prem(20))-10}" text-anchor="end">已繳 57.1 萬</text>
  <text class="lab-c" x="${x(20)+8}" y="${Y(cv(20))+18}">解約金約 48.6 萬</text>
 </svg>`;
}

/* ---------- Render ---------- */
const TITLES={home:'今日',news:'新聞彙整',clients:'客戶',proposal:'建議書簡化',needs:'需求與媒合',products:'商品庫',partners:'合作保險公司',team:'業務員與用量'};
function render(){
 document.getElementById('navList').innerHTML=NAV[state.role].map(([k,t,i])=>`<li><button class="nav-btn" data-act="go" data-v="${k}" ${state.view===k?'aria-current="page"':''}>${ic(i,22)}<span>${t}</span></button></li>`).join('');
 document.getElementById('pageTitle').textContent=TITLES[state.view];
 document.getElementById('view').innerHTML=V[state.view]();
 document.getElementById('app').classList.toggle('present',state.present);
 document.getElementById('presentBanner').hidden=!state.present;
 document.getElementById('presentBtn').innerHTML=`${ic('eye',18)}${state.present?'結束展示':'客戶展示模式'}`;
 document.getElementById('presentBtn').hidden=state.role!=='agent'||state.present;
 document.getElementById('roleSel').value=state.role;
 if(state.view==='proposal'&&state.step===3)runStages();
}
function runStages(){
 clearTimeout(stageTimer);
 if(state.stage>=STAGES.length)return;
 stageTimer=setTimeout(()=>{state.stage++;if(state.view==='proposal'&&state.step===3){document.getElementById('view').innerHTML=V.proposal();runStages()}},900);
}
let toastT;
function toast(msg){
 document.querySelectorAll('.toast').forEach(t=>t.remove());
 const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);
 clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2600);
}
function modal(html){
 document.getElementById('overlay').innerHTML=`<div class="modal-bg" data-act="closeBg"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
 document.querySelector('.modal button')?.focus();
}
const closeModal=()=>{document.getElementById('overlay').innerHTML=''};

const ACT={
 go(d){state.view=d.v;if(d.step){state.step=+d.step;if(+d.step===3)state.stage=0}if(d.tab)state.needsTab=d.tab;render();scrollTo(0,0)},
 client(d){state.view='clients';state.clientId=d.id;render();scrollTo(0,0)},
 present(){state.present=!state.present;if(state.present&&state.role!=='agent')state.present=false;render()},
 newsCat(d){state.newsCat=d.c;render()},
 newsPreview(d){const n=NEWS.find(x=>x.id===d.id);modal(`
  <div class="modal-h"><h2>客戶看到的分享卡片</h2><button class="icon-btn" data-act="close" aria-label="關閉">${ic('x',20)}</button></div>
  <div class="line-card"><div class="lc-top">${n.title}</div><div class="lc-body"><p>${n.sum}</p>
   ${n.invest?'<p class="disclaim">以上內容僅供參考，非投資建議。</p>':''}
   <p class="lc-from">來源：${n.src}（點擊閱讀原文）<br>由 林子晴 · 示範保經 分享</p></div></div>
  <p class="small muted">客戶版會自動拿掉「聊天切入點」等內部內容。</p>
  <div class="panel-h"><button class="btn" data-act="copy" data-id="${n.id}">${ic('copy',16)}複製文字</button><button class="btn line" data-act="toast" data-msg="示範：開啟 LINE 分享">${ic('share',16)}分享到 LINE</button></div>`)},
 copy(d){const n=NEWS.find(x=>x.id===d.id);const txt=`${n.title}\n${n.sum}${n.invest?'\n（僅供參考，非投資建議）':''}`;
  navigator.clipboard?.writeText(txt).then(()=>toast('已複製'),()=>toast('無法存取剪貼簿，請手動選取文字複製'))??toast('無法存取剪貼簿')},
 close:closeModal,
 closeBg(d,e){if(e.target.classList.contains('modal-bg'))closeModal()},
 toast(d){toast(d.msg)},
 step(d){state.step=+d.s;if(state.step===3)state.stage=0;render();scrollTo(0,0)},
 confirm(d,e){const i=+d.i;e.target.checked?state.confirmed.add(i):state.confirmed.delete(i);const y=scrollY;document.getElementById('view').innerHTML=V.proposal();scrollTo(0,y)},
 needsTab(d){state.needsTab=d.t;render()},
 prodFilter(d){state.prodFilter=d.f;render()},
 star(d){const p=PRODUCTS[+d.i];p.star=!p.star;render();toast(p.star?`已將「${p.name}」設為主推`:`已取消主推`)},
 partner(d){const p=PARTNERS[+d.i];p.on=!p.on;render();toast(`${p.co} ${p.on?'已開啟合作':'已關閉合作'}`)}
};
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;
 if(el.type==='checkbox'&&el.dataset.act!=='confirm')return;
 const f=ACT[el.dataset.act];if(f){f(el.dataset,e)}
});
document.addEventListener('input',e=>{
 if(e.target.id==='clientSearch'){state.clientQ=e.target.value;const pos=e.target.selectionStart;render();const s=document.getElementById('clientSearch');s.focus();s.setSelectionRange(pos,pos)}
 if(e.target.id==='qBud')document.getElementById('qBudV').textContent=fmt(+e.target.value);
});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='custForm')toast('示範：問卷已送出，業務員會收到通知')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.getElementById('roleSel').addEventListener('change',e=>{state.role=e.target.value;state.present=false;state.view=NAV[state.role][0][0];render()});
render();
</script>
